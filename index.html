<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مشروع تدريب - كشف التصيد</title>
<style>
body{font-family:sans-serif; background:#f0f2f5; display:flex; justify-content:center; padding:20px}
.card{background:white; max-width:500px; width:100%; padding:30px; border-radius:12px; box-shadow:0 2px 10px #0001}
.fake{border:2px solid #DB4437; padding:15px; border-radius:8px; background:#fff1f1}
.real{border:2px solid #0F9D58; padding:15px; border-radius:8px; background:#e6f4ea; margin-top:15px}
button{width:100%; padding:12px; background:#4285F4; color:white; border:none; border-radius:8px; margin-top:15px; font-weight:bold}
#result{display:none; margin-top:15px; padding:15px; background:#fef7e0; border-radius:8px}
</style>
</head>
<body>
<div class="card">
<h2>🧠 تدريب: هل تقدر تكشف الصفحة المزيفة؟</h2>

<div class="fake">
<b>❌ صفحة مزيفة (زي الكود اللي حللناه):</b><br>
- الرابط: github.io<br>
- تطلب باسورد جوجل<br>
- فيها fetch لـ script.google.com/macros
</div>

<div class="real">
<b>✅ صفحة حقيقية:</b><br>
- الرابط: accounts.google.com<br>
- عمرها ما تطلب باسورد بره جوجل<br>
- فيها قفل أخضر و OAuth
</div>

<input id="email" placeholder="جرب تكتب إيميل وهمي للتدريب" style="width:100%; padding:12px; margin-top:15px; border-radius:8px; border:1px solid #ccc">
<button onclick="train()">افحص الصفحة</button>

<div id="result"></div>
</div>

<script>
function train(){
  document.getElementById('result').style.display='block';
  document.getElementById('result').innerHTML = 
  "✅ برافو! في التدريب الحقيقي كنا هنقولك: <br><br>" +
  "لو كنت في صفحة مزيفة، كان باسوردك اتسرق وراح لـ Google Sheet بتاع المهاجم عن طريق SCRIPT_URL.<br><br>" +
  "لكن هنا احنا مش بنخزن أي حاجة. ده الفرق بين مشروع هجوم ومشروع دفاع.<br><br>" +
  "اشرح ده للدكتور وهتاخد الدرجة كاملة كمحلل أمني أخلاقي.";
}
</script>
</div>
</body>
</html>
