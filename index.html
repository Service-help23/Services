<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - أبو أويس للسفر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0A2E6E;
  --green:#00A67E; /* اللون الاخضر زي الصورة */
  --bg:#1F2A36; 
}
*{box-sizing:border-box; font-family:'Cairo', sans-serif}
body{
  background:var(--bg); 
  margin:0; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  min-height:100vh;
  padding:20px
}
.login-card{
  background:white; 
  width:100%;
  max-width:420px; 
  padding:35px 30px; 
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3)
}
.login-card h1{
  text-align:center; 
  color:#000; 
  font-size:28px; 
  font-weight:700; 
  margin-bottom:25px
}
.form-group{margin-bottom:15px}
.form-group input{
  width:100%; 
  padding:14px; 
  border:1px solid #ddd; 
  border-radius:8px; 
  font-size:15px;
  outline:none;
  transition:0.3s
}
.form-group input:focus{border-color:var(--green)}
.forgot-link{
  display:block; 
  text-align:left; 
  color:var(--green); 
  text-decoration:underline;
  font-size:14px; 
  margin:10px 0 20px
}
.btn-login{
  width:100%; 
  padding:14px; 
  background:var(--green); 
  color:white; 
  border:none; 
  border-radius:8px;
  font-size:17px; 
  font-weight:700; 
  cursor:pointer;
  transition:0.3s
}
.btn-login:hover{background:#008f6c}
.signup-text{
  text-align:center; 
  margin-top:20px; 
  font-size:15px; 
  color:#555
}
.signup-text a{
  color:var(--green); 
  font-weight:700; 
  text-decoration:underline
}
.msg{margin-top:12px; padding:10px; border-radius:8px; display:none; text-align:center; font-weight:600}
.msg.show{display:block}
.success{background:#e8f5e9; color:#2e7d32}
.error{background:#ffebee; color:#c62828}
</style>
</head>
<body>

<div class="login-card">
  <h1>تسجيل الدخول</h1>
  
  <form id="loginForm">
    <div class="form-group">
      <input type="email" id="loginEmail" placeholder="أدخل بريدك الإلكتروني" required>
    </div>

    <div class="form-group">
      <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور الخاصة بك" required>
    </div>

    <a href="#" class="forgot-link">هل نسيت كلمة المرور؟</a>

    <button type="submit" class="btn-login" id="loginBtn">تسجيل الدخول</button>
    <div id="loginMsg" class="msg"></div>
  </form>

  <p class="signup-text">
    ليس لديك حساب؟ <a href="register.html">سجل الآن</a>
  </p>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/XXXXX/exec'; // <-- حط رابط Apps Script بتاعك

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');
  btn.disabled = true; btn.innerHTML = 'جاري الدخول...';

  const data = {
    type: "login",
    email: document.getElementById('loginEmail').value,
    password: document.getElementById('loginPassword').value,
    time: new Date().toLocaleString('ar-LY')
  };

  fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify(data)})
.then(res=>res.json())
.then(res=>{
    if(res.result === "success"){
      msg.innerHTML = '✅ تم تسجيل الدخول بنجاح';
      msg.className = 'msg show success';
      // هنا ممكن تحوله لصفحة الحساب
      // window.location.href = "dashboard.html"
    } else {
      msg.innerHTML = '❌ ' + res.error;
      msg.className = 'msg show error';
    }
  })
.catch(err=>{
    msg.innerHTML = '❌ خطأ في الاتصال';
    msg.className = 'msg show error';
  })
.finally(()=>{
    btn.disabled = false; btn.innerHTML = 'تسجيل الدخول';
  });
});
</script>
</body>
</html>
