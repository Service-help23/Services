<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --g-blue:#4285F4;   /* G */
  --g-red:#DB4437;    /* o */
  --g-yellow:#F4B400; /* o */
  --g-green:#0F9D58;  /* g */
  --g-gray:#5f6368;
  --g-border:#dadce0;
  --g-bg:#fff;
  --page-bg:#f5f5f5;
}
*{box-sizing:border-box; font-family:'Roboto', 'Cairo', sans-serif}
body{
  background:linear-gradient(135deg, var(--g-blue), var(--g-red), var(--g-yellow), var(--g-green)); 
  margin:0; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  min-height:100vh; 
  padding:20px
}
.login-box{
  background:var(--g-bg); 
  width:100%;
  max-width:450px; 
  padding:48px 40px 36px; 
  border-radius:12px;
  border:2px solid var(--g-border);
  box-shadow:0 8px 24px rgba(0,0,0,0.15)
}
.logo{text-align:center; margin-bottom:30px}
.logo h2{font-size:28px; margin:0; font-weight:500; letter-spacing:-1px}
.logo .b1{color:var(--g-blue)}
.logo .b2{color:var(--g-red)}
.logo .b3{color:var(--g-yellow)}
.logo .b4{color:var(--g-blue)}
.logo .b5{color:var(--g-green)}
.logo .b6{color:var(--g-red)}
.logo .b7{color:var(--g-gray)}

.form-group{position:relative; margin-bottom:24px}
.form-group input{
  width:100%; 
  padding:13px 15px; 
  border:2px solid var(--g-border); 
  border-radius:6px; 
  font-size:16px;
  outline:none;
  color:#202124;
  transition:0.2s
}
/* الوان البوردر بتتغير حسب الفوكس */
.form-group:nth-child(1) input:focus{border-color:var(--g-blue)}
.form-group:nth-child(2) input:focus{border-color:var(--g-red)}

.form-group label{
  position:absolute;
  top:13px; right:15px;
  color:var(--g-gray); font-size:16px;
  pointer-events:none;
  transition:0.15s;
  background:var(--g-bg); padding:0 4px
}
.form-group input:focus + label,
.form-group input:not(:placeholder-shown) + label{
  top:-8px; font-size:12px; 
}
.form-group:nth-child(1) input:focus + label{color:var(--g-blue)}
.form-group:nth-child(2) input:focus + label{color:var(--g-red)}

.btn{
  width:100%; 
  padding:12px 24px; 
  background:linear-gradient(90deg, var(--g-blue), var(--g-green)); /* جرادينت */
  color:white; 
  border:none; 
  border-radius:6px;
  font-size:15px; 
  font-weight:700; 
  cursor:pointer;
  margin-top:8px;
  transition:0.3s
}
.btn:hover{background:linear-gradient(90deg, var(--g-green), var(--g-yellow)); transform:translateY(-1px)}
.btn:active{background:linear-gradient(90deg, var(--g-yellow), var(--g-red))}

.footer-text{
  text-align:center; 
  margin-top:28px; 
  font-size:12px; 
  color:var(--g-gray)
}
.footer-text b{color:var(--g-blue); font-weight:700}
.hidden{display:none}
.msg{margin-top:15px; padding:12px; border-radius:6px; text-align:center; font-size:14px; font-weight:600; display:none; border:2px solid}
.msg.show{display:block}
.success{background:#e6f4ea; color:var(--g-green); border-color:var(--g-green)}
.error{background:#fce8e6; color:var(--g-red); border-color:var(--g-red)}
.info{background:#e8f0fe; color:var(--g-blue); border-color:var(--g-blue)}
.warning{background:#fef7e0; color:var(--g-yellow); border-color:var(--g-yellow)}
</style>
</head>
<body>

<div class="login-box">
  <div class="logo">
    <h2>
      <span class="b1">أ</span>
      <span class="b2">ب</span>
      <span class="b3">و</span>
      <span class="b4"> </span>
      <span class="b4">أ</span>
      <span class="b5">و</span>
      <span class="b6">ي</span>
      <span class="b7">س</span>
      <span style="font-size:16px; font-weight:400;"> للسفر والسياحة</span>
    </h2>
  </div>

  <!-- فورم التسجيل -->
  <form id="regForm">
    <div class="form-group">
      <input type="email" id="regEmail" placeholder=" " required>
      <label>البريد الإلكتروني</label>
    </div>
    <div class="form-group">
      <input type="password" id="regPassword" placeholder=" " required>
      <label>كلمة المرور</label>
    </div>
    <button type="submit" class="btn" id="regBtn">التالي</button>
    <div id="regMsg" class="msg"></div>
  </form>

  <!-- فورم التحقق -->
  <form id="verifyForm" class="hidden">
    <div class="form-group">
      <input type="text" id="verifyCode" placeholder=" " maxlength="6" required>
      <label>رمز التحقق</label>
    </div>
    <input type="hidden" id="verifyEmail">
    <button type="submit" class="btn">تأكيد</button>
    <div id="verifyMsg" class="msg"></div>
  </form>

  <p class="footer-text">
    © 2026 <b>أبو أويس للسفر والسياحة</b>
  </p>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/XXXXX/exec'; // <-- حط الرابط

function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.innerHTML = text;
  el.className = 'msg show ' + type; // success=اخضر, error=احمر, info=ازرق, warning=اصفر
}

// التسجيل
document.getElementById('regForm').addEventListener('submit', e=>{
  e.preventDefault();
  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.innerText = 'جاري الإرسال...';
  showMsg('regMsg', '⏳ جاري ارسال الكود...', 'info'); // ازرق
  const code = Math.floor(100000 + Math.random() * 900000);
  
  const data = {
    action: "register",
    name: "بدون اسم",
    email: regEmail.value, 
    password: regPassword.value, 
    code: code
  };

  fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify(data)})
.then(res=>res.json()).then(res=>{
    if(res.result==="success"){
      verifyEmail.value = regEmail.value;
      document.getElementById('regForm').classList.add('hidden');
      document.getElementById('verifyForm').classList.remove('hidden');
      showMsg('verifyMsg', '✅ تم ارسال كود التحقق', 'success'); // اخضر
    } else { showMsg('regMsg','❌ '+res.error,'error') } // احمر
  }).finally(()=>{btn.disabled=false; btn.innerText='التالي'})
});

// التحقق
document.getElementById('verifyForm').addEventListener('submit', e=>{
  e.preventDefault();
  showMsg('verifyMsg', '⏳ جاري التأكيد...', 'warning'); // اصفر
  const data = {action:"verify", email:verifyEmail.value, code:verifyCode.value};
  fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify(data)})
.then(res=>res.json()).then(res=>{
    if(res.result==="success"){
      showMsg('verifyMsg','✅ تم تأكيد ايميلك بنجاح','success');
    } else { showMsg('verifyMsg','❌ الكود غير صحيح','error') }
  })
});
</script>
</body>
</html>
