<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - أبو أويس للسفر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue:#0A2E6E;
      --orange:#FF7A00;
      --bg:#F5F7FA;
    }
    *{box-sizing:border-box; font-family:'Cairo', sans-serif}
    body{background:var(--bg); margin:0; padding:40px 20px}
    header{text-align:center; margin-bottom:30px}
    header img{height:60px}
    header h1{color:var(--blue); margin:10px 0 0}

   .container{display:grid; grid-template-columns:1fr 1fr; gap:30px; max-width:950px; margin:auto}
   .login-box{
      background:white; padding:30px; border-radius:12px;
      box-shadow:0 6px 25px rgba(10,46,110,0.1)
    }
   .login-box h2{color:var(--blue); text-align:center; margin-bottom:20px; font-size:22px}
   .form-group{margin-bottom:15px}
   .form-group label{display:block; margin-bottom:6px; font-weight:600; font-size:14px; color:#333}
   .form-group input{
      width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:15px; outline:none
    }
   .form-group input:focus{border-color:var(--orange)}
   .btn{
      width:100%; padding:12px; border:none; border-radius:8px;
      color:white; font-weight:700; cursor:pointer; font-size:16px; transition:0.3s
    }
   .btn-orange{background:var(--orange)}
   .btn-orange:hover{background:#e56e00}
   .btn-blue{background:var(--blue)}
   .btn-blue:hover{background:#08264f}
   .msg{margin-top:12px; padding:10px; border-radius:8px; display:none; text-align:center; font-weight:600}
   .msg.show{display:block}
   .msg.success{background:#e8f5e9; color:#2e7d32}
   .msg.error{background:#ffebee; color:#c62828}
    footer{text-align:center; margin-top:40px; color:#666; font-size:14px}

    @media(max-width:768px){
    .container{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<header>
  <img src="https://raw.githubusercontent.com/abuowaystravel/Owis/main/logo%20-01.jpg" alt="Logo">
  <h1>بوابة عملاء أبو أويس للسفر</h1>
</header>

<div class="container">

  <!-- فورم التسجيل -->
  <div class="login-box">
    <h2>إنشاء حساب جديد</h2>
    <form id="registerForm">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="regName" required>
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="regEmail" required>
      </div>
      <div class="form-group">
        <label>رقم الواتساب</label>
        <input type="tel" id="regPhone" placeholder="9665xxxxxxx" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="regPassword" required>
      </div>
      <button type="submit" class="btn btn-orange" id="regBtn">إنشاء الحساب</button>
      <div id="regMsg" class="msg"></div>
    </form>
  </div>

  <!-- فورم تسجيل الدخول -->
  <div class="login-box">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn btn-blue" id="loginBtn">دخول</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </div>

</div>

<footer>
  © 2026 أبو أويس للسفر والسياحة - جميع الحقوق محفوظة
</footer>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/XXXXX/exec'; // <-- غير ده برابطك

function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.innerHTML = text;
  el.className = 'msg show ' + type;
  setTimeout(()=> el.classList.remove('show'), 4000);
}

// التسجيل
document.getElementById('registerForm').addEventListener('submit', function(e){
  e.preventDefault();
  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.innerHTML = 'جاري التسجيل...';

  const data = {
    type: "register",
    name: document.getElementById('regName').value,
    email: document.getElementById('regEmail').value,
    phone: document.getElementById('regPhone').value,
    password: document.getElementById('regPassword').value,
    time: new Date().toLocaleString('ar-LY')
  };
  sendData(data, 'regMsg', 'regBtn', 'إنشاء الحساب', 'registerForm');
});

// تسجيل الدخول
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = 'جاري الدخول...';

  const data = {
    type: "login",
    email: document.getElementById('loginEmail').value,
    password: document.getElementById('loginPassword').value,
    time: new Date().toLocaleString('ar-LY')
  };
  sendData(data, 'loginMsg', 'loginBtn', 'دخول', 'loginForm');
});

function sendData(data, msgId, btnId, btnText, formId){
  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(data)
  })
.then(res => res.json())
.then(res => {
    if(res.result === "success"){
      showMsg(msgId, '✅ تم بنجاح', 'success');
      document.getElementById(formId).reset();
    } else {
      showMsg(msgId, '❌ ' + res.error, 'error');
    }
  })
.catch(err => showMsg(msgId, '❌ حدث خطأ في الاتصال', 'error'))
.finally(()=>{
    document.getElementById(btnId).disabled = false;
    document.getElementById(btnId).innerHTML = btnText;
  });
}
</script>

</body>
</html>
