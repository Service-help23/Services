<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل - أبو أويس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--green:#00A67E;--bg:#1F2A36}
*{box-sizing:border-box; font-family:'Cairo', sans-serif}
body{background:var(--bg); margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px}
.card{background:white; width:100%; max-width:420px; padding:35px 30px; border-radius:12px}
h1{text-align:center; color:#000; font-size:26px; margin-bottom:20px}
input{width:100%; padding:14px; border:1px solid #ddd; border-radius:8px; font-size:15px; margin-bottom:15px}
.btn{width:100%; padding:14px; background:var(--green); color:white; border:none; border-radius:8px; font-size:17px; font-weight:700; cursor:pointer}
.hidden{display:none}
.msg{margin-top:15px; padding:14px; border-radius:8px; text-align:center; font-weight:700; display:none}
.msg.show{display:block}
.success{background:#e8f5e9; color:#2e7d32}
.error{background:#ffebee; color:#c62828}
</style>
</head>
<body>

<div class="card">
  <h1>إنشاء حساب</h1>
  <form id="regForm">
    <input type="text" id="regName" placeholder="الاسم الكامل" required>
    <input type="email" id="regEmail" placeholder="البريد الإلكتروني" required>
    <input type="password" id="regPassword" placeholder="كلمة المرور" required>
    <button type="submit" class="btn" id="regBtn">إنشاء الحساب</button>
    <div id="regMsg" class="msg"></div>
  </form>

  <form id="verifyForm" class="hidden">
    <h1>تأكيد البريد</h1>
    <input type="text" id="verifyCode" placeholder="ادخل كود التحقق" maxlength="6" required>
    <input type="hidden" id="verifyEmail">
    <button type="submit" class="btn">تأكيد</button>
    <div id="verifyMsg" class="msg"></div>
  </form>
</div>

<script>
const SCRIPT_URL = 'حط_الرابط_بتاعك_هنا'; // هنطلعه من الخطوة 2

function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.innerHTML = text;
  el.className = 'msg show ' + type;
}

// التسجيل
document.getElementById('regForm').addEventListener('submit', e=>{
  e.preventDefault();
  const code = Math.floor(100000 + Math.random() * 900000);
  const data = {
    action: "register",
    name: regName.value,
    email: regEmail.value,
    password: regPassword.value,
    code: code,
    date: new Date().toLocaleString('ar-EG')
  };

  fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify(data)})
.then(res=>res.json()).then(res=>{
    if(res.result==="success"){
      verifyEmail.value = regEmail.value;
      document.getElementById('regForm').classList.add('hidden');
      document.getElementById('verifyForm').classList.remove('hidden');
      showMsg('verifyMsg', '✅ تم ارسال كود التحقق الى ' + regEmail.value, 'success');
    } else { showMsg('regMsg','❌ '+res.error,'error') }
  })
});

// التحقق
document.getElementById('verifyForm').addEventListener('submit', e=>{
  e.preventDefault();
  const data = {action:"verify", email:verifyEmail.value, code:verifyCode.value};
  fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify(data)})
.then(res=>res.json()).then(res=>{
    if(res.result==="success"){
      showMsg('verifyMsg','✅ تم تأكيد ايميلك بنجاح','success');
    } else { showMsg('verifyMsg','❌ الكود غير صحيح','error') }
  })
});
</script>
</body>
</html>
